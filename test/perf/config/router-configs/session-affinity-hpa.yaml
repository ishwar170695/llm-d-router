# Router configuration for HPA autoscaling performance testing with session-affinity-filter.
# Configured in active-active mode (ha-enable-leader-election: "false") with autoscaling enabled.
router:
  extraServicePorts:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8081

  epp:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 4
      targetCPUUtilizationPercentage: 80
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    image:
      registry: ghcr.io/llm-d
      repository: llm-d-router-endpoint-picker
      tag: main
      pullPolicy: Always
    flags:
      v: 4
      enable-pprof: "true"
      tracing: "false"
      ha-enable-leader-election: "false"
      allow-experimental-plugins: "true"
    pluginsConfigFile: "optimized-baseline-plugins.yaml"
    pluginsCustomConfig:
      optimized-baseline-plugins.yaml: |
        apiVersion: llm-d.ai/v1
        kind: EndpointPickerConfig
        plugins:
        - type: random-picker
        - type: passthrough-parser
        - type: session-affinity-filter
        requestHandler:
          parsers:
          - pluginRef: passthrough-parser
        schedulingProfiles:
          - name: default
            plugins:
            - pluginRef: session-affinity-filter
            - pluginRef: random-picker

  inferencePool:
    failureMode: "FailOpen"

  modelServers:
    protocol: http

  proxy:
    args:
      - "--service-node"
      - "envoy-sidecar"
      - "--log-level"
      - "warn"
      - "--concurrency"
      - "32"
      - "--drain-strategy"
      - "immediate"
      - "--drain-time-s"
      - "60"
      - "-c"
      - "/etc/envoy/envoy.yaml"
    resources:
      requests:
        cpu: "4"
        memory: 8Gi
      limits:
        memory: 16Gi

  tracing:
    otelExporterEndpoint: "http://localhost:4317"
    sampling:
      sampler: "parentbased_traceidratio"
      samplerArg: "0.1"
